[project]
name = "lawson-criterion-paper"
version = "0.1.0"
description = "Codebase for generating plots and tables for 'Update: Progress toward fusion energy breakeven and gain as measured against the Lawson criteria'"
readme = "README.md"
requires-python = ">=3.11"
# Core runtime dependencies for the `lib/` physics package — kept slim so
# downstream consumers (e.g. FEB) don't pull in the paper's plotting stack.
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
# Everything needed to regenerate the paper's figures and notebooks. Install
# with `uv sync --extra paper` (or `pip install lawson-criterion-paper[paper]`).
paper = [
    "matplotlib>=3.9.0",
    "tqdm>=4.60.0",
    "pillow>=10.0.0",
    "jupytext==1.18.1",
    "jupyter",
    "jupyterlab",
    "ipykernel",
    "notebook",
    "jupyter-collaboration>=4.2.1",
    "plotly>=6.6.0",
    "kaleido>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The importable package is `lib` (consumers do `from lib import reactivity`),
# which doesn't match the distribution name, so point hatch at it explicitly.
[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.hatch.build.targets.sdist]
include = ["lib", "config", "pyproject.toml", "README.md"]
